<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Emotion Finder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #1e1e2e;
      --card:     #2a2a3e;
      --accent:   #a78bfa;
      --accent2:  #f472b6;
      --text:     #e2e8f0;
      --subtext:  #94a3b8;
      --btn:      #3b3b5c;
      --btnhov:   #4c4c72;
      --green:    #4ade80;
      --yellow:   #facc15;
      --orange:   #fb923c;
      --radius:   12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px 60px;
    }

    .shell {
      width: 100%;
      max-width: 520px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    header h1 {
      font-size: 1.9rem;
      color: var(--accent);
      letter-spacing: -0.5px;
    }
    header p {
      color: var(--subtext);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    /* ── Progress ── */
    .progress-area {
      margin-bottom: 16px;
    }
    .progress-label {
      text-align: right;
      font-size: 0.8rem;
      color: var(--subtext);
      margin-bottom: 4px;
    }
    .progress-track {
      height: 6px;
      background: var(--btn);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.35s ease;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px 28px 24px;
      margin-bottom: 20px;
    }
    .question-text {
      font-size: 1.1rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    /* ── Options ── */
    .option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 6px;
      border: 2px solid transparent;
    }
    .option:hover { background: var(--btn); }
    .option.selected {
      border-color: var(--accent);
      background: rgba(167,139,250,0.12);
    }
    .option input[type="radio"] { display: none; }
    .radio-dot {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid var(--subtext);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.15s;
    }
    .option.selected .radio-dot {
      border-color: var(--accent);
    }
    .radio-dot::after {
      content: "";
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .option.selected .radio-dot::after { opacity: 1; }
    .option-label { font-size: 0.97rem; }

    /* ── Next button ── */
    #next-btn {
      display: block;
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    #next-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    #next-btn:not(:disabled):hover { background: var(--accent2); }

    /* ── Results ── */
    #results { display: none; }
    .result-heading {
      text-align: center;
      color: var(--subtext);
      font-size: 1rem;
      margin-bottom: 16px;
    }
    .result-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 14px;
      border-left: 4px solid;
    }
    .result-card.first  { border-color: var(--green);  }
    .result-card.second { border-color: var(--yellow); }
    .result-card.third  { border-color: var(--orange); }
    .result-rank {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .result-card.first  .result-rank  { color: var(--green);  }
    .result-card.second .result-rank  { color: var(--yellow); }
    .result-card.third  .result-rank  { color: var(--orange); }
    .result-name {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .result-card.first  .result-name  { color: var(--green);  }
    .result-card.second .result-name  { color: var(--yellow); }
    .result-card.third  .result-name  { color: var(--orange); }
    .result-desc { font-size: 0.93rem; color: var(--text); line-height: 1.5; }

    #again-btn {
      display: block;
      width: 100%;
      padding: 13px;
      background: var(--btn);
      color: var(--text);
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.15s;
    }
    #again-btn:hover { background: var(--btnhov); }
  </style>
</head>
<body>
<div class="shell">

    </div>

      <div class="question-text" id="q-text"></div>
      <div id="options-container"></div>
    </div>

    <button id="next-btn" disabled>Next →</button>
  </div>

  <!-- Results UI -->
  <div id="results">
    <p class="result-heading">You might be feeling…</p>
    <div id="result-cards"></div>
    <button id="again-btn">↺ Try Again</button>
  </div>

</div>

function showQuestion() {
  const q = QUESTIONS[qIndex];
  const total = QUESTIONS.length;

  progLabel.textContent = `Question ${qIndex + 1} of ${total}`;
  progFill.style.width  = `${(qIndex / total) * 100}%`;
  qText.textContent     = q.text;

  optCont.innerHTML = "";
  selectedIdx = null;
  nextBtn.disabled = true;

  q.options.forEach(([label, val], i) => {
    const div = document.createElement("div");
    div.className = "option";
    div.innerHTML = `<div class="radio-dot"></div><span class="option-label">${label}</span>`;
    div.addEventListener("click", () => selectOption(i, val));
    optCont.appendChild(div);
  });
}

function selectOption(i, val) {
  selectedIdx = { i, val };
  [...optCont.children].forEach((el, idx) => {
    el.classList.toggle("selected", idx === i);
  });
  nextBtn.disabled = false;
}

// ── Next / finish ──────────────────────────────────────────────────────────
nextBtn.addEventListener("click", () => {
  if (selectedIdx === null) return;
  answers[QUESTIONS[qIndex].dim] = selectedIdx.val;
  qIndex++;

  if (qIndex < QUESTIONS.length) {
    showQuestion();
  } else {
    showResults();
  }
});

// ── Score ──────────────────────────────────────────────────────────────────
function score(emotion) {
  const dims = Object.keys(answers);
  return Math.sqrt(dims.reduce((sum, d) => sum + (emotion[d] - answers[d]) ** 2, 0));
}

// ── Results ────────────────────────────────────────────────────────────────
function showResults() {
  quiz.style.display = "none";
  results.style.display = "block";

  const ranked = [...EMOTIONS].sort((a, b) => score(a) - score(b)).slice(0, 3);
  const styles = [
    { cls: "first",  rank: "Most likely"    },
    { cls: "second", rank: "Also possible"  },
    { cls: "third",  rank: "Or maybe"       },
  ];

  resultCards.innerHTML = "";
  ranked.forEach((em, i) => {
    const { cls, rank } = styles[i];
    const card = document.createElement("div");
    card.className = `result-card ${cls}`;
    card.innerHTML = `
      <div class="result-rank">${rank}</div>
      <div class="result-name">${em.e}</div>
      <div class="result-desc">${em.d}</div>
    `;
    resultCards.appendChild(card);
  });
}

// ── Again ──────────────────────────────────────────────────────────────────
againBtn.addEventListener("click", () => {
  qIndex  = 0;
  answers = {};
  results.style.display = "none";
  quiz.style.display    = "block";
  showQuestion();
});

// ── Init ───────────────────────────────────────────────────────────────────
showQuestion();
</script>
</body>
</html>
